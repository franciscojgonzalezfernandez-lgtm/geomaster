name: Claude PR review

# Automated PR review + conditional auto-approval (ADR-0018).
# Runs ONLY after the CI workflows finish successfully (workflow_run), in a fresh
# clean context per PR. A Claude cloud agent reads the diff for correctness bugs and
# vulnerabilities and emits a machine-readable verdict; a deterministic gate decides
# whether to auto-approve. Schema/migration diffs are fenced in CI, never trusted to
# the agent. No-ops safely if ANTHROPIC_API_KEY is absent.
#
# Prerequisites (owner, one-time):
#   1. Install the Claude GitHub app on this repo.
#   2. Add repository secret ANTHROPIC_API_KEY.
#   3. Enable branch protection on main requiring the CI + smoke + this review check.

on:
  workflow_run:
    workflows: ["CI core", "CI web", "CI smoke"]
    types: [completed]

permissions:
  contents: read
  pull-requests: write
  checks: read

concurrency:
  group: claude-review-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: true

jobs:
  guard:
    runs-on: ubuntu-latest
    outputs:
      proceed: ${{ steps.g.outputs.proceed }}
      pr_number: ${{ steps.g.outputs.pr_number }}
      head_sha: ${{ steps.g.outputs.head_sha }}
      has_key: ${{ steps.k.outputs.has_key }}
    steps:
      - id: k
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: echo "has_key=${{ env.ANTHROPIC_API_KEY != '' }}" >> "$GITHUB_OUTPUT"
      - id: g
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          echo "head_sha=$HEAD_SHA" >> "$GITHUB_OUTPUT"
          # The triggering CI run must itself be green.
          if [ "$RUN_CONCLUSION" != "success" ]; then
            echo "Triggering run not successful ($RUN_CONCLUSION) — skip."
            echo "proceed=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # Resolve the open PR for this head SHA.
          PR=$(gh api "repos/$REPO/commits/$HEAD_SHA/pulls" --jq '.[0].number' 2>/dev/null || echo "")
          if [ -z "$PR" ] || [ "$PR" = "null" ]; then
            echo "No open PR for $HEAD_SHA — skip."
            echo "proceed=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "pr_number=$PR" >> "$GITHUB_OUTPUT"
          # Every CI workflow run that executed for this SHA must have succeeded
          # (don't review on a red build; wait until the last one is green).
          BAD=$(gh api "repos/$REPO/actions/runs?head_sha=$HEAD_SHA&event=pull_request" \
            --jq '[.workflow_runs[] | select(.name|IN("CI core","CI web","CI smoke")) | select(.status!="completed" or .conclusion!="success")] | length')
          if [ "$BAD" != "0" ]; then
            echo "Not all CI workflows are green yet for $HEAD_SHA — skip (a later completion retriggers)."
            echo "proceed=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "proceed=true" >> "$GITHUB_OUTPUT"

  review:
    needs: guard
    if: ${{ needs.guard.outputs.proceed == 'true' && needs.guard.outputs.has_key == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write  # anthropics/claude-code-action mints its GitHub App token via OIDC
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.guard.outputs.head_sha }}
          fetch-depth: 0

      - id: diff
        name: Compute diff and schema fence (deterministic, not trusted to the agent)
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ needs.guard.outputs.pr_number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          BASE=$(gh api "repos/$REPO/pulls/$PR" --jq '.base.sha')
          git fetch --no-tags origin "$BASE"
          CHANGED=$(git diff --name-only "$BASE"...HEAD)
          echo "$CHANGED" > changed-files.txt
          # Protected paths from config (schema + migrations). Fence computed here, in CI.
          TOUCHES_SCHEMA=false
          while IFS= read -r pat; do
            [ -z "$pat" ] && continue
            if echo "$CHANGED" | grep -qiE "$(printf '%s' "$pat" | sed 's#\*\*#.*#g; s#/#\\/#g')"; then
              TOUCHES_SCHEMA=true
            fi
          done < <(yq -r '.auto_approve.block_on_paths[]' .github/claude/config.yml)
          echo "touches_schema=$TOUCHES_SCHEMA" >> "$GITHUB_OUTPUT"
          echo "base_sha=$BASE" >> "$GITHUB_OUTPUT"

      - name: Claude review (clean context) → verdict JSON
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # Tools kept minimal and read-only except for writing the verdict file.
          claude_args: '--allowedTools "Read,Grep,Glob,Bash(git diff:*),Bash(git log:*),Write"'
          prompt: |
            You are reviewing GitHub PR #${{ needs.guard.outputs.pr_number }} for the GEOMASTER
            monorepo, in a fresh context. Read CLAUDE.md, docs/architecture.md and the relevant
            ADRs/specs, then review ONLY the diff of this PR against its base
            (${{ steps.diff.outputs.base_sha }}...HEAD; files in changed-files.txt).

            Raise a BLOCKING finding only for a concrete, merge-blocking problem in the diff:
            a correctness bug; a security/vulnerability issue (OWASP Top 10, secrets, injection,
            broken authz, a tenant-owned query not scoped by account_id); a hard-coded plan limit
            (limits must come from packages/plans); an LLM call outside the provider layer; or a
            user-facing string added without all of EN/DE/FR/ES. A concern that does NOT apply to
            this diff is not a finding (e.g. Lighthouse/i18n when no public page or UI string is
            touched; provider-layer when no LLM call is added). CI already ran: tests, smoke and
            Lighthouse are enforced by required checks — do not re-block on those unless the diff
            itself introduces a clear violation.

            Scoring (quality_score, 0-100 = merge-readiness): a correct, well-scoped change that
            matches the spec/ADRs and carries adequate tests scores 90-100. Drop below 90 only for
            real concerns (weak/missing tests for new logic, unclear or risky code, scope creep).
            Reserve low scores for diffs with genuine problems. Do not penalize a change for
            things outside its scope.

            Write your verdict to ./claude-verdict.json (and nothing else to the repo), exactly:
            {
              "quality_score": <0-100 integer>,
              "blocking_findings": [{"severity":"high|med","title":"...","file":"...","why":"..."}],
              "summary": "<2-4 sentence review summary>"
            }
            Also post the summary and findings as a PR review comment. Do not approve or merge —
            the gate decides from this verdict.

      - name: Upload verdict
        uses: actions/upload-artifact@v4
        with:
          name: claude-verdict
          path: claude-verdict.json
          if-no-files-found: warn

      - id: gate
        name: Policy gate (deterministic) → this job's success/failure IS the required `review` check
        # Design B (ADR-0018): no GitHub approval is used. main requires 0 approvals and the
        # `review` status check. This step encodes the verdict as the check result:
        #   enabled + policy passes → auto-merge + exit 0 (check GREEN → mergeable)
        #   enabled + held/schema  → comment + exit 1 (check RED → blocked; admin override only)
        #   disabled (kill-switch) → advisory comment, no auto-merge, exit 0 (GREEN, non-blocking)
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ needs.guard.outputs.pr_number }}
          REPO: ${{ github.repository }}
          TOUCHES_SCHEMA: ${{ steps.diff.outputs.touches_schema }}
        run: |
          set -euo pipefail
          cfg() { yq -r "$1" .github/claude/config.yml; }
          ENABLED=$(cfg '.auto_approve.enabled')
          MIN=$(cfg '.auto_approve.min_quality_score')

          if [ ! -f claude-verdict.json ]; then
            echo "No verdict file — treating as score 0 with a blocking finding."
            SCORE=0; BLOCKING=1
          else
            SCORE=$(jq -r '(.quality_score // 0) | floor' claude-verdict.json)
            BLOCKING=$(jq -r '(.blocking_findings // []) | length' claude-verdict.json)
          fi
          echo "score=$SCORE blocking_findings=$BLOCKING"

          # Per-PR opt-out labels.
          LABELS=$(gh api "repos/$REPO/issues/$PR/labels" --jq '.[].name' 2>/dev/null || true)
          LABEL_BLOCK=false
          while IFS= read -r l; do
            [ -n "$l" ] && echo "$LABELS" | grep -qx "$l" && LABEL_BLOCK=true
          done < <(yq -r '.auto_approve.block_on_labels[]' .github/claude/config.yml)

          # Kill-switch: advisory only, never blocks or auto-merges. Humans merge manually.
          if [ "$ENABLED" != "true" ]; then
            gh pr comment "$PR" --body "🤖 Claude review (advisory — auto-approval disabled in config). score ${SCORE}. See review above; merge is manual. (ADR-0018)"
            echo "auto-approval disabled → advisory, non-blocking."
            exit 0
          fi

          REASON=""
          [ "$TOUCHES_SCHEMA" = "true" ] && REASON="diff touches DB schema/migration — human required"
          [ "$LABEL_BLOCK" = "true" ] && REASON="opt-out label present"
          [ "$SCORE" -ge "$MIN" ] 2>/dev/null || REASON="quality score $SCORE < $MIN"
          [ "$BLOCKING" = "0" ] || REASON="$BLOCKING blocking finding(s)"

          if [ -z "$REASON" ]; then
            echo "Policy passed for PR #$PR (score=$SCORE, no blocking findings) → enabling auto-merge."
            gh pr merge "$PR" --auto --squash || echo "auto-merge enable failed (not fatal)."
            gh pr comment "$PR" --body "🤖 Claude review: **policy passed** (score ${SCORE}, no blocking findings, no schema change). Auto-merge enabled. (ADR-0018)"
            exit 0
          else
            echo "Holding PR #$PR for a human: $REASON"
            gh pr comment "$PR" --body "🤖 Claude review: **held for a human** — ${REASON}. Review comments above; admin merge required. (score ${SCORE}, ADR-0018)"
            exit 1
          fi
