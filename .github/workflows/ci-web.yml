name: CI web
on:
  # No path filter on PRs: this job is a required check and must always report (ADR-0019).
  pull_request:
  push:
    branches: [main]
    paths: ["apps/web/**", "packages/**", "package.json", "pnpm-lock.yaml", "pnpm-workspace.yaml", "turbo.json"]
jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Unit tests (Vitest) run here; e2e and Lighthouse need core + Postgres and run in web-smoke.
      - run: pnpm turbo run lint typecheck build test --filter=@geomaster/web...
