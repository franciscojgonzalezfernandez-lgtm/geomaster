name: Deploy core
# apps/web deploys through the Vercel GitHub integration; apps/core deploys to Fly.io from here.
on:
  push:
    branches: [main]
    paths: ["apps/core/**", "packages/plans/**", "gradle/**", "gradlew", "settings.gradle.kts", ".dockerignore", ".github/workflows/deploy-core.yml"]
  workflow_dispatch:
concurrency:
  group: deploy-core
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      # Build context is the repo root: the Dockerfile needs the Gradle wrapper and packages/plans.
      - run: flyctl deploy . --config apps/core/fly.toml --dockerfile apps/core/Dockerfile --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
