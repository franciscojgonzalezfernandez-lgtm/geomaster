name: CI smoke

# Smoke gate (ADR-0013): boot the real artifacts and assert the system comes up.
# A green build with a dead runtime does not pass.

on:
  pull_request:
    paths: ["apps/**", "packages/**", "gradle/**", "gradlew", "settings.gradle.kts", "package.json", "pnpm-lock.yaml", "turbo.json", ".github/workflows/ci-smoke.yml"]
  push:
    branches: [main]

jobs:
  web-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @geomaster/web... build
      - name: Start web and assert 200
        run: |
          set -euo pipefail
          pnpm --filter @geomaster/web exec next start -p 3000 &
          SRV=$!
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/ || true)
            [ "$code" = "200" ] && { echo "web up (200)"; kill $SRV; exit 0; }
            sleep 2
          done
          echo "web did not return 200 in time"; kill $SRV || true; exit 1

  core-smoke:
    runs-on: ubuntu-latest
    services:
      db:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: geomaster
          POSTGRES_PASSWORD: geomaster
          POSTGRES_DB: geomaster
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U geomaster"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :core:bootJar
      - name: Boot core and assert /actuator/health is UP
        env:
          DATABASE_URL: jdbc:postgresql://localhost:5432/geomaster
          DATABASE_USER: geomaster
          DATABASE_PASSWORD: geomaster
        run: |
          set -euo pipefail
          java -jar apps/core/build/libs/*.jar &
          APP=$!
          for i in $(seq 1 45); do
            if curl -fsS http://localhost:8080/actuator/health | grep -q '"status":"UP"'; then
              echo "core up (health UP)"; kill $APP; exit 0
            fi
            sleep 2
          done
          echo "core health not UP in time"; kill $APP || true; exit 1
