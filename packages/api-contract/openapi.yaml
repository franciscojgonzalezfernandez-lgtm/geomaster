# Contract between apps/web and apps/core (ADR-0016).
# Generated by springdoc from apps/core (GET /v3/api-docs.yaml) and committed here; T6/T15 add
# the gradle export task and the CI drift check.
openapi: 3.1.0
info:
  title: GEOMASTER core API
  description: Called only by apps/web with a short-lived EdDSA service token (ADR-0017).
  version: 0.1.0
servers:
- url: /
security:
- serviceToken: []
paths:
  /v1/users/me:
    post:
      tags:
      - accounts-controller
      operationId: provision
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ProvisionResponse"
    patch:
      tags:
      - accounts-controller
      operationId: update
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/UserResponse"
  /v1/projects:
    get:
      tags:
      - projects-controller
      operationId: list
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProjectResponse"
    post:
      tags:
      - projects-controller
      operationId: create
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProjectRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ProjectResponse"
  /v1/projects/{id}:
    get:
      tags:
      - projects-controller
      operationId: get
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ProjectResponse"
  /v1/account:
    get:
      tags:
      - accounts-controller
      operationId: account
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/AccountResponse"
components:
  schemas:
    AccountResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        planId:
          type: string
    ProvisionResponse:
      type: object
      properties:
        user:
          $ref: "#/components/schemas/UserResponse"
        account:
          $ref: "#/components/schemas/AccountResponse"
    UserResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
        name:
          type: string
        interfaceLocale:
          type: string
    CreateProjectRequest:
      type: object
      properties:
        domain:
          type: string
        languages:
          type: array
          items:
            type: string
        country:
          type: string
        region:
          type: string
    ProjectResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        domain:
          type: string
        languages:
          type: array
          items:
            type: string
        country:
          type: string
        region:
          type: string
        status:
          type: string
        createdAt:
          type: string
          format: date-time
    UpdateUserRequest:
      type: object
      properties:
        interfaceLocale:
          type: string
  securitySchemes:
    serviceToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
