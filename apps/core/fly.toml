# Fly.io app for apps/core (ADR-0006). Deploy from the repository root:
#   fly deploy --config apps/core/fly.toml
# Secrets (fly secrets set): DATABASE_URL (jdbc:postgresql://…?sslmode=require), DATABASE_USER,
# DATABASE_PASSWORD, WEB_JWKS_URI, SERVICE_TOKEN_ISSUER, SERVICE_TOKEN_AUDIENCE, OPENAI_API_KEY,
# OPENAI_ENABLED, ANTHROPIC_API_KEY, EXTRACTOR_ENABLED (extraction-analysis T4),
# OTEL_EXPORTER_OTLP_HEADERS (Langfuse auth; scripts/set-langfuse-secret.sh).
app = "geomaster-core"
primary_region = "fra"

[build]
  dockerfile = "Dockerfile"

[env]
  JAVA_TOOL_OPTIONS = "-XX:+UseSerialGC -Xss512k"
  # OpenTelemetry agent → Langfuse EU over OTLP (scan-engine T11). Auth: OTEL_EXPORTER_OTLP_HEADERS secret, set with scripts/set-langfuse-secret.sh.
  OTEL_SDK_DISABLED = "false"
  OTEL_SERVICE_NAME = "geomaster-core"
  OTEL_TRACES_EXPORTER = "otlp"
  OTEL_METRICS_EXPORTER = "none"
  OTEL_LOGS_EXPORTER = "none"
  OTEL_EXPORTER_OTLP_PROTOCOL = "http/protobuf"
  OTEL_EXPORTER_OTLP_ENDPOINT = "https://cloud.langfuse.com/api/public/otel"
  # Only our own spans (scan.plan, scan.unit, chat <model>, scan.finalize): the queue polls the
  # database every second, and JDBC/HTTP auto-instrumentation would flood Langfuse.
  OTEL_INSTRUMENTATION_COMMON_DEFAULT_ENABLED = "false"
  OTEL_INSTRUMENTATION_OPENTELEMETRY_API_ENABLED = "true"
  OTEL_INSTRUMENTATION_OPENTELEMETRY_INSTRUMENTATION_ANNOTATIONS_ENABLED = "true"

[http_service]
  internal_port = 8080
  force_https = true
  # The scan workers poll the queue in-process: keep one machine running (no scale-to-zero).
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "60s"
    interval = "30s"
    method = "GET"
    path = "/actuator/health"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
