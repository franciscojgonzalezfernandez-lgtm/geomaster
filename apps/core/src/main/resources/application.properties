spring.application.name=core
spring.threads.virtual.enabled=true
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/geomaster}
spring.datasource.username=${DATABASE_USER:geomaster}
spring.datasource.password=${DATABASE_PASSWORD:geomaster}
management.endpoints.web.exposure.include=health,info
springdoc.api-docs.path=/v3/api-docs
# Service token (ADR-0017): web's Better Auth JWT plugin is the issuer; core verifies via its JWKS.
geomaster.auth.jwks-uri=${WEB_JWKS_URI:http://localhost:3000/api/auth/jwks}
geomaster.auth.issuer=${SERVICE_TOKEN_ISSUER:http://localhost:3000}
geomaster.auth.audience=${SERVICE_TOKEN_AUDIENCE:http://localhost:3000}
