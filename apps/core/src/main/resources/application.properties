spring.application.name=core
spring.threads.virtual.enabled=true
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/geomaster}
spring.datasource.username=${DATABASE_USER:geomaster}
spring.datasource.password=${DATABASE_PASSWORD:geomaster}
management.endpoints.web.exposure.include=health,info
springdoc.api-docs.path=/v3/api-docs
# Service token (ADR-0017): web's Better Auth JWT plugin is the issuer; core verifies via its JWKS.
geomaster.auth.jwks-uri=${WEB_JWKS_URI:http://localhost:3000/api/auth/jwks}
geomaster.auth.issuer=${SERVICE_TOKEN_ISSUER:http://localhost:3000}
geomaster.auth.audience=${SERVICE_TOKEN_AUDIENCE:http://localhost:3000}
# Deterministic, JSON-typed contract (packages/api-contract/openapi.yaml is diffed in CI, ADR-0016).
springdoc.writer-with-order-by-keys=true
springdoc.default-produces-media-type=application/json
springdoc.default-consumes-media-type=application/json
# LLM providers (ADR-0007, scan-engine). Engines stay disabled until their adapter, key, model and
# prices are configured; keys only from the environment. usd-to-chf converts USD list prices to CHF.
geomaster.providers.usd-to-chf=${USD_TO_CHF:0.80}
# ChatGPT: `chat-latest` is the ChatGPT-labelled model in OpenAI pricing, the closest API proxy for
# the consumer app (FR-SCN-01); override with OPENAI_MODEL. USD list prices 2026-11:
# $5 / 1M input, $30 / 1M output, $10 / 1k web searches (search content billed as input tokens).
geomaster.providers.engines.openai.enabled=${OPENAI_ENABLED:false}
geomaster.providers.engines.openai.api-key=${OPENAI_API_KEY:}
geomaster.providers.engines.openai.model=${OPENAI_MODEL:chat-latest}
geomaster.providers.engines.openai.max-searches=2
geomaster.providers.engines.openai.prices.version=openai-2026-11
geomaster.providers.engines.openai.prices.input-per-million-usd=5.00
geomaster.providers.engines.openai.prices.output-per-million-usd=30.00
geomaster.providers.engines.openai.prices.per-thousand-searches-usd=10.00
geomaster.providers.engines.gemini.enabled=false
geomaster.providers.engines.gemini.api-key=${GEMINI_API_KEY:}
geomaster.providers.engines.claude.enabled=false
geomaster.providers.engines.claude.api-key=${ANTHROPIC_API_KEY:}

# Weekly scheduler (scan-engine T10): hourly pass, one instance at a time via an advisory lock.
geomaster.scan.scheduler.enabled=${SCAN_SCHEDULER_ENABLED:true}
geomaster.scan.scheduler.cron=0 7 * * * *
